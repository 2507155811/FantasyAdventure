name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: 6000.0.40f1
          buildMethod: FantasyAndroidBuild.Build
          buildsPath: build
          buildName: FantasyAdventure
          versioning: None

      - name: Explain Unity build errors
        if: failure()
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import re
          path = Path('build/unity-errors.log')
          if not path.exists():
              print('::warning::Unity did not produce an editor error report; inspect the Build with Unity log.')
          else:
              lines = path.read_text(errors='replace').splitlines()
              for line in lines[:60]:
                  if not line.strip():
                      continue
                  line = re.sub(r'(?i)(password|token|secret|serial|license)\s*[:=]\s*\S+', r'\1=[REDACTED]', line)
                  line = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::error title=Unity build diagnostic::' + line[:1500])
          PYTHON

      - name: Upload Unity error report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Unity-build-errors
          path: build/unity-errors.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FantasyAdventure-Android-APK
          path: build/Android/*.apk
          if-no-files-found: error
          retention-days: 14

  publish-download:
    name: Publish APK download
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4
      - name: Download verified build artifact
        uses: actions/download-artifact@v4
        with:
          name: FantasyAdventure-Android-APK
          path: release-apk
      - name: Publish downloadable preview
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_tag="v0.3.0-${GITHUB_SHA:0:7}"
          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" release-apk/FantasyAdventure.apk --clobber
          else
            gh release create "$release_tag" release-apk/FantasyAdventure.apk \
              --target "$GITHUB_SHA" --prerelease \
              --title "0.3.0 单机全流程验收版 (${GITHUB_SHA:0:7})" \
              --notes-file Docs/RELEASE_030.md
          fi
